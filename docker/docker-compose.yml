# docker/docker-compose.yml
services:
  blender-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.blender
      args:
        - CUDA_VERSION=${CUDA_VERSION:-11.8.0}
    container_name: blender-service
    image: blender-service:latest

    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,graphics,utility
      - UDS_ONLY=${UDS_ONLY:-false}

    volumes:
      - ../.runtime/workspace:/workspace
      - ../.runtime/socks:/socks
      - ../.runtime/logs:/app/logs

    ports:
      - "${MESHWORK_BIND_ADDR:-127.0.0.1}:${BLENDER_GRPC_PORT:-50051}:50051"

    restart: unless-stopped

  colmap-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.colmap
      args:
        - BASE_TAG=${COLMAP_TAG:-latest}
    container_name: colmap-service
    image: colmap-service:latest

    environment:
      - PYTHONUNBUFFERED=1
      - UDS_ONLY=${UDS_ONLY:-false}

    volumes:
      - ../.runtime/workspace:/workspace
      - ../.runtime/socks:/socks
      - ../.runtime/logs:/app/logs

    ports:
      - "${MESHWORK_BIND_ADDR:-127.0.0.1}:${COLMAP_GRPC_PORT:-50052}:50052"

    restart: unless-stopped

  alicevision-service:
    build:
      context: ../
      dockerfile: docker/Dockerfile.alicevision
      args:
        - BASE_TAG=${ALICEVISION_TAG:-3.2.0-ubuntu20.04-cuda11.3.1}
    container_name: alicevision-service
    image: alicevision-service:latest

    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,graphics,utility
      - UDS_ONLY=${UDS_ONLY:-false}

    volumes:
      - ../.runtime/workspace:/workspace
      - ../.runtime/socks:/socks
      - ../.runtime/logs:/app/logs

    ports:
      - "${MESHWORK_BIND_ADDR:-127.0.0.1}:${ALICEVISION_GRPC_PORT:-50053}:50053"

    restart: unless-stopped

networks:
  default:
    driver: bridge
